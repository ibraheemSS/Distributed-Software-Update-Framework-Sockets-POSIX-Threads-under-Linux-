# Update server configuration - large 24 MiB package
PORT=5500
MAX_WORKERS=16
ACCEPT_BACKLOG=64
QUEUE_CAPACITY=128
MANIFEST_PATH=./config/manifest_large.conf
PACKAGE_DIR=./packages
LOG_FILE=./logs/server.log
