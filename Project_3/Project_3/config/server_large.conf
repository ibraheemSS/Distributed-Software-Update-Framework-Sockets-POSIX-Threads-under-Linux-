CHUNK_SIZE=32768
CLIENT_TIMEOUT_SEC=30
PAUSE_HOLD_TIMEOUT_SEC=5
TLS_CERT=./config/server.crt
TLS_KEY=./config/server.key
CA_CERT=./config/ca.crt
CLIENT_REGISTRY=./config/clients.keys
